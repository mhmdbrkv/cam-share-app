<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
    <title>CamShare latency stopwatch</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f132a; color: #fff; font-family: Consolas, ui-monospace, monospace; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
      #t { font-size: 14vw; font-weight: 700; letter-spacing: 0.02em; }
      #bar { width: 80vw; height: 6vh; background: #222a52; position: relative; }
      #fill { position: absolute; left: 0; top: 0; bottom: 0; background: #6366f1; }
      p { color: #9fb3c8; font-size: 2vw; margin: 0; text-align: center; max-width: 80vw; }
    </style>
  </head>
  <body>
    <div id="t">00.000</div>
    <div id="bar"><div id="fill"></div></div>
    <p>CamShare latency stopwatch (seconds.milliseconds, wraps every 60 s). Film this with the phone camera
      while recording; in the recording, compare the screen value with the value shown inside the PiP.</p>
    <script>
      const t = document.getElementById("t"), fill = document.getElementById("fill");
      function tick() {
        const ms = Date.now() % 60000;
        t.textContent = (ms / 1000).toFixed(3).padStart(6, "0");
        fill.style.width = ((ms % 1000) / 10) + "%";
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
