<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CamShare Camera</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui;
        background: #111;
        color: #eee;
        text-align: center;
      }
      video {
        width: 100%;
        max-height: 70vh;
        background: #000;
      }
      button {
        font-size: 1.2rem;
        padding: 0.8rem 1.6rem;
        margin: 1rem;
        border: 0;
        border-radius: 10px;
        background: #4f8cff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <video id="v" autoplay muted playsinline></video>
    <p id="s">Ready</p>
    <button id="b">Connect Camera</button>
    <script>
      const room = new URLSearchParams(location.search).get("s"),
        $ = (i) => document.getElementById(i);
      let ws,
        pc,
        stream,
        wake,
        busy = false,
        offerSequence = 0,
        activeNegotiationId = null;
      let iceServers = [{ urls: "stun:stun.l.google.com:19302" }];
      let pendingIce = [];
      let messageQueue = Promise.resolve();
      const send = (o) =>
        ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
      let retryMs = 2000;
      function connect() {
        ws = new WebSocket(location.origin.replace(/^http/, "ws"));
        ws.onopen = () => {
          retryMs = 2000;
          send({ t: "join", room, role: "phone" });
        };
        ws.onclose = (e) => {
          // 4001: another phone page took over this session. Reconnecting would
          // kick it back out and the two pages would fight (and hit the join rate limit).
          if (e.code === 4001) {
            $("s").textContent = "Another device took over this camera session.";
            return;
          }
          setTimeout(connect, retryMs + Math.random() * 500);
          retryMs = Math.min(retryMs * 2, 30000);
        };
        ws.onmessage = (e) => {
          messageQueue = messageQueue
            .then(async () => {
              const d = JSON.parse(e.data);
              if (d.t === "config" && Array.isArray(d.iceServers)) {
                iceServers = d.iceServers;
                return;
              }
              if (d.t === "peer" && d.up && stream) offer();
              if (d.t === "sig" && pc) {
                if (d.data.sdp) {
                  if (
                    (d.data.negotiationId &&
                      d.data.negotiationId !== activeNegotiationId) ||
                    pc.signalingState !== "have-local-offer"
                  )
                    return;
                  await pc.setRemoteDescription(d.data.sdp);
                  for (const candidate of pendingIce)
                    await pc.addIceCandidate(candidate);
                  pendingIce = [];
                } else if (d.data.ice) {
                  if (
                    d.data.negotiationId &&
                    d.data.negotiationId !== activeNegotiationId
                  )
                    return;
                  if (pc.remoteDescription)
                    await pc.addIceCandidate(d.data.ice);
                  else pendingIce.push(d.data.ice);
                }
              }
            })
            .catch((error) => {
              $("s").textContent = "Connection error: " + error.message;
            });
        };
      }
      async function offer() {
        if (busy) return;
        busy = true;
        const negotiationId = `${Date.now()}-${++offerSequence}`;
        activeNegotiationId = negotiationId;
        try {
          if (pc) pc.close();
          pendingIce = [];
          const currentPc = (pc = new RTCPeerConnection({ iceServers }));
          stream.getTracks().forEach((t) => currentPc.addTrack(t, stream));
          currentPc.onicecandidate = (e) =>
            e.candidate &&
            send({
              t: "sig",
              data: { negotiationId, ice: e.candidate },
            });
          currentPc.onconnectionstatechange = () => {
            if (pc === currentPc)
              $("s").textContent = "Connection: " + currentPc.connectionState;
          };
          await currentPc.setLocalDescription(await currentPc.createOffer());
          if (pc === currentPc && activeNegotiationId === negotiationId)
            send({
              t: "sig",
              data: { negotiationId, sdp: currentPc.localDescription },
            });
        } catch (error) {
          $("s").textContent = "Connection error: " + error.message;
        } finally {
          busy = false;
        }
      }
      $("b").onclick = async () => {
        try {
          const video = {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 },
          };
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video,
              audio: true,
            });
          } catch (audioError) {
            stream = await navigator.mediaDevices.getUserMedia({
              video,
              audio: false,
            });
            $("s").textContent =
              "Camera connected; microphone unavailable: " + audioError.message;
          }
          $("v").srcObject = stream;
          $("b").style.display = "none";
          try {
            wake = await navigator.wakeLock.request("screen");
          } catch {}
          document.addEventListener("visibilitychange", async () => {
            if (!document.hidden)
              try {
                wake = await navigator.wakeLock.request("screen");
              } catch {}
          });
          offer();
        } catch (e) {
          $("s").textContent = "Camera error: " + e.message;
        }
      };
      connect();
    </script>
  </body>
</html>
